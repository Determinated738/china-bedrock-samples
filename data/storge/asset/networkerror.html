            <div>@x@...哎呀！网络不给力呀！...</div>
            <div id="try">点击重试~</div>
        </div>
        <script>
			const browser = (function () {
			  const u = navigator.userAgent
			  const browser = { // 移动终端浏览器版本信息
				trident: u.indexOf('Trident') > -1, // IE内核
				presto: u.indexOf('Presto') > -1, // opera内核
				webKit: u.indexOf('AppleWebKit') > -1, // 苹果、谷歌内核
				gecko: u.indexOf('Gecko') > -1 && u.indexOf('KHTML') === -1, // 火狐内核
				mobile: !!u.match(/AppleWebKit.*Mobile.*/), // 是否为移动终端
				ios: !!u.match(/\(i[^;]+;( U;)? CPU.+Mac OS X/), // ios终端
				android: u.indexOf('Android') > -1 || u.indexOf('Linux') > -1, // android终端或者uc浏览器
				iPhone: u.indexOf('iPhone') > -1, // 是否为iPhone或者QQHD浏览器
				iPad: u.indexOf('iPad') > -1, // 是否iPad
				webApp: u.indexOf('Safari') === -1 // 是否web应该程序，没有头部与底部
			  }
			  return browser
			})()
		
            var fileInput = document.getElementById('try');
            fileInput.onclick = function() {
				let jsonObject = {}
				jsonObject.module_name = 'utility'
				jsonObject.func_name = 'on_exception_page_retry'
				jsonObject.use_instance = false
				jsonObject.args = []
				jsonObject.tag = ''
				invokePyFunc('json:' + JSON.stringify(jsonObject))
            };
			
			function invokePyFunc (message) {
			  try {
				if (browser.ios) {
				  window.webkit.messageHandlers.mc.postMessage(message)
				} else if (browser.android) {
				  window.mc.sendMessage(message)
				} else {
				  if (message.substring(0, 5) === 'json:') {
					const jsonObject = JSON.parse(message.substring(5))
					if (jsonObject && jsonObject.tag) {
					  window.ComPyCallback.resolve('{"return" : ""}', jsonObject.tag)
					}
				  }
				}
			  } catch (err) {
				if (message.substring(0, 5) === 'json:') {
				  const jsonObject = JSON.parse(message.substring(5))
				  if (jsonObject && jsonObject.tag) {
					window.ComPyCallback.resolve('{"return" : ""}', jsonObject.tag)
				  }
				}
				console.warn('Can not match browser.')
			  }
			}
        </script>
